<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店主后台 · 会员储值管理系统（精简开源版）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand">会员<span class="accent">储值</span> 后台</div>
      <div class="side-link active" data-view="dashboard">仪表盘</div>
      <div class="side-link" data-view="members">会员管理</div>
      <div class="side-link" data-view="transactions">交易记录</div>
      <div class="side-link" id="btnResetData" style="margin-top:20px;color:var(--red)">重置示例数据</div>
      <a href="index.html" class="side-link">← 返回前台</a>
    </aside>

    <main class="admin-main">
      <section id="view-dashboard" class="admin-view active">
        <div class="page-head"><h1>仪表盘</h1><p>会员储值总览。</p></div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>会员</th><th>类型</th><th>金额</th><th>余额</th><th>时间</th></tr></thead>
            <tbody id="recentTxBody"></tbody>
          </table>
        </div>
      </section>

      <section id="view-members" class="admin-view">
        <div class="page-head"><h1>会员管理</h1><p>添加、编辑或删除会员。</p></div>
        <div class="table-toolbar">
          <span></span>
          <button class="btn btn-primary btn-sm" id="btnAddMember">+ 新增会员</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>姓名</th><th>手机号</th><th>等级</th><th>余额</th><th>入会日期</th><th>操作</th></tr></thead>
            <tbody id="membersBody"></tbody>
          </table>
        </div>
      </section>

      <section id="view-transactions" class="admin-view">
        <div class="page-head"><h1>交易记录</h1><p>全部会员的充值与消费流水。</p></div>
        <div class="table-toolbar">
          <div class="filter-row" id="txFilters">
            <button class="filter-btn active" data-type="all">全部</button>
            <button class="filter-btn" data-type="recharge">充值</button>
            <button class="filter-btn" data-type="consume">消费</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>会员</th><th>类型</th><th>金额</th><th>余额</th><th>备注</th><th>时间</th></tr></thead>
            <tbody id="txBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="memberModalBackdrop">
    <div class="modal">
      <button class="modal-close" id="btnCloseMemberModal">&times;</button>
      <h2 id="memberModalTitle">新增会员</h2>
      <p class="sub" id="memberModalHint"></p>
      <div id="memberModalMsg"></div>
      <form id="memberForm" novalidate>
        <input type="hidden" id="memberIdInput">
        <div class="field"><label>姓名</label><input id="memberNameInput" type="text" required></div>
        <div class="field"><label>手机号</label><input id="memberPhoneInput" type="text" required></div>
        <div class="field-row">
          <div class="field"><label id="memberBalanceLabel">初始余额（元）</label><input id="memberBalanceInput" type="number" min="0" step="0.01" value="0" required></div>
          <div class="field">
            <label>会员等级</label>
            <select id="memberLevelInput">
              <option value="普通">普通</option>
              <option value="银卡">银卡</option>
              <option value="金卡">金卡</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">保存</button>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
