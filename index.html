<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会员储值查询台（精简开源版）</title>
<meta name="description" content="免费开源的会员储值管理系统精简版：前台查询会员余额、在线充值、消费扣款，后台会员增删改查、交易记录、数据看板，真实增删改查功能，纯前端+localStorage实现，可作为学习或二次开发起点。">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">会员<span class="accent">储值</span></div>
    <a href="admin.html" class="nav-link">进入店主后台 →</a>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>会员储值自助查询台</h1>
      <p>输入手机号查询会员余额和最近交易记录，可直接办理充值或消费扣款。这是一个真实可用的精简开源系统，数据保存在你浏览器本地。</p>
    </div>

    <div class="search-box">
      <input id="phoneInput" type="text" placeholder="输入会员手机号，例如 13800000001" inputmode="numeric">
      <button id="btnSearch" class="btn btn-primary">查询</button>
    </div>
    <div id="searchMsg"></div>

    <div id="memberCard" class="member-card" style="display:none">
      <div class="member-card__head">
        <div>
          <h2 id="mName"></h2>
          <div class="sub" id="mPhone"></div>
        </div>
        <span class="badge level" id="mLevel"></span>
      </div>

      <div class="balance-display">
        <div class="balance-num" id="mBalance"></div>
        <div class="balance-label">当前储值余额（元）</div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="btnOpenRecharge">＋ 充值</button>
        <button class="btn" id="btnOpenConsume">－ 消费</button>
      </div>

      <h3 class="section-title">最近交易记录</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>时间</th><th>类型</th><th>金额</th><th>余额</th><th>备注</th></tr></thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal-backdrop" id="rechargeModalBackdrop">
    <div class="modal">
      <button class="modal-close" id="btnCloseRecharge">&times;</button>
      <h2>会员充值</h2>
      <p class="sub" id="rechargeSub"></p>
      <div id="rechargeMsg"></div>
      <form id="rechargeForm" novalidate>
        <div class="field">
          <label>充值金额（元）</label>
          <input id="rechargeAmountInput" type="number" min="1" step="0.01" required placeholder="例如 200">
        </div>
        <div class="field">
          <label>备注（可选）</label>
          <input id="rechargeNoteInput" type="text" placeholder="例如：办卡赠送、活动充值">
        </div>
        <button type="submit" class="btn btn-primary btn-block">确认充值</button>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="consumeModalBackdrop">
    <div class="modal">
      <button class="modal-close" id="btnCloseConsume">&times;</button>
      <h2>会员消费</h2>
      <p class="sub" id="consumeSub"></p>
      <div id="consumeMsg"></div>
      <form id="consumeForm" novalidate>
        <div class="field">
          <label>消费金额（元）</label>
          <input id="consumeAmountInput" type="number" min="1" step="0.01" required placeholder="例如 60">
        </div>
        <div class="field">
          <label>备注（可选）</label>
          <input id="consumeNoteInput" type="text" placeholder="例如：剪发、洗护套餐">
        </div>
        <button type="submit" class="btn btn-primary btn-block">确认消费</button>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>

<footer style="margin:40px auto 16px;max-width:1100px;padding:16px 20px 0;border-top:1px solid var(--line,rgba(147,160,184,.18));text-align:center;color:var(--muted,#93A0B8);font-size:13px">精简开源演示 &middot; 完整版：<a href="https://inzyxuashop.com/huiyuanchuzhi-yuanma.html" target="_blank" rel="noopener" style="color:var(--cyan,#19B8D4);text-decoration:none">会员储值系统源码</a></footer>
